<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2B5A8A"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B7AAD"/>
      <stop offset="100%" style="stop-color:#2B5A8A"/>
    </linearGradient>
  </defs>

  <!-- Shield Shape -->
  <path d="M10 15 L10 55 Q10 80 45 95 Q80 80 80 55 L80 15 Q45 20 10 15 Z" fill="url(#shieldGradient)" stroke="#1E3A5F" stroke-width="1"/>

  <!-- Top section with circuit pattern -->
  <path d="M10 15 L10 45 L80 45 L80 15 Q45 20 10 15 Z" fill="url(#topGradient)"/>

  <!-- Circuit lines (left side) -->
  <g stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="18" y1="25" x2="18" y2="40"/>
    <line x1="18" y1="32" x2="30" y2="32"/>
    <line x1="30" y1="25" x2="30" y2="40"/>
    <circle cx="18" cy="25" r="2.5" fill="#FFFFFF"/>
    <circle cx="30" cy="25" r="2.5" fill="#FFFFFF"/>
    <circle cx="18" cy="40" r="2" fill="#FFFFFF"/>
    <circle cx="30" cy="40" r="2" fill="#FFFFFF"/>
  </g>

  <!-- EU Stars (right side) -->
  <g fill="#FFFFFF" opacity="0.95">
    <polygon points="55,22 56.5,26 61,26 57.5,28.5 59,33 55,30.5 51,33 52.5,28.5 49,26 53.5,26" transform="scale(0.6) translate(35,10)"/>
    <polygon points="55,22 56.5,26 61,26 57.5,28.5 59,33 55,30.5 51,33 52.5,28.5 49,26 53.5,26" transform="scale(0.6) translate(55,10)"/>
    <polygon points="55,22 56.5,26 61,26 57.5,28.5 59,33 55,30.5 51,33 52.5,28.5 49,26 53.5,26" transform="scale(0.6) translate(75,10)"/>
    <polygon points="55,22 56.5,26 61,26 57.5,28.5 59,33 55,30.5 51,33 52.5,28.5 49,26 53.5,26" transform="scale(0.6) translate(45,25)"/>
    <polygon points="55,22 56.5,26 61,26 57.5,28.5 59,33 55,30.5 51,33 52.5,28.5 49,26 53.5,26" transform="scale(0.6) translate(65,25)"/>
  </g>

  <!-- Divider line -->
  <line x1="12" y1="47" x2="78" y2="47" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

  <!-- Checkmark -->
  <path d="M30 62 L40 75 L60 55" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Text: EU AI ACT -->
  <text x="95" y="45" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A5F">EU AI ACT</text>

  <!-- Text: Audit Platform -->
  <text x="95" y="72" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#5D6D7E">Audit Platform</text>
</svg>
