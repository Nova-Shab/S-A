<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- CALM text (lighter gray-blue) -->
  <text x="10" y="70" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" fill="#8BA3B8" letter-spacing="-1">CALM</text>

  <!-- PLIANCE text (darker blue) -->
  <text x="165" y="70" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" fill="#3D5A73" letter-spacing="-1">PLIANCE</text>

  <!-- SCANNER text (medium gray, smaller) -->
